# QA-only stack. Deliberately separate from the repo-root docker-compose.yml:
# everyone needs pgvector, only QA needs a database viewer, so this file is
# brought up on its own and never touches the shared services.
#
#   docker compose -f qa/docker-compose.yml up -d     (from the repo root)
#   cd qa && docker compose up -d                     (equivalent)
#
# It runs as its own Compose project, so `docker compose down` at the repo root
# leaves it alone, and bringing this down leaves the database running.
services:
  # Browser-based DB viewer - the practical replacement for the H2 console that
  # spec 004 retired. Reaches both databases on the pgvector server:
  #   banking_core - core banking data (what the backend now reads/writes)
  #   banking_chat - chatbot knowledge base and interaction log
  # Local dev convenience only; not part of the app's runtime.
  adminer:
    image: adminer:4.8.1
    container_name: qa-adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    # Reaches the database over the host's published port rather than a shared
    # Docker network, which is what keeps this file independent of the root
    # stack. It therefore also works against a Postgres running natively on the
    # host, not just the pgvector container.
    extra_hosts:
      # Docker Desktop resolves host.docker.internal already; this line is what
      # makes the same file work on Linux.
      - "host.docker.internal:host-gateway"
    environment:
      # Pre-fills the "Server" field on the login form. Note this is all it does -
      # the image has no equivalent for the driver, and the "System" dropdown
      # defaults to MySQL. Submitting the form with MySQL selected against a
      # Postgres port HANGS rather than failing: the MySQL client sits waiting for
      # a server greeting that never comes. Open Adminer through
      #   http://localhost:8090/?pgsql=host.docker.internal:5433
      # which preselects PostgreSQL, instead of the bare host:port.
      ADMINER_DEFAULT_SERVER: host.docker.internal:5433
